services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    # The base image's WORKDIR is /home/irisowner, but the Dockerfile overrides it to
    # /home/irisowner/dev for the build step. At runtime that path is the bind-mounted
    # host checkout, which the container user (irisowner, uid 51773) cannot write to,
    # so the /iris-main entrypoint aborts with
    # "Unable to find/open file iris-main.log in current directory".
    # Keep the runtime cwd off the bind mount so iris-main.log is writable.
    working_dir: /home/irisowner
    environment:
      - ISC_CPF_MERGE_FILE=/home/irisowner/dev/merge.cpf
    ports:
      - "1972:1972"
      - "52773:52773"
      - "53773:53773"
    volumes:
      - ./:/home/irisowner/dev

  # Spec 008: a target server for remote steps. Not published on the host; the primary
  # reaches it on the compose network as http://iris-target:52773.
  iris-target:
    build:
      context: .
      dockerfile: Dockerfile_target
    restart: always

  # Spec 011: the default embedding provider, local to this stack. all-minilm is 43.8 MB
  # (BERT, 23M parameters, embedding length 384) and the product talks to it over the
  # OpenAI-compatible POST /v1/embeddings.
  #
  # Not published on the host: `iris` reaches it on this network as http://ollama:11434.
  # That name does NOT resolve to any pre-existing ollama container — an unrelated one is
  # on the triageaide_fhir-net network — so declaring it here is what makes it reproducible.
  ollama:
    image: ollama/ollama:latest
    restart: always
    volumes:
      - ollama-models:/root/.ollama
    # The image ships no model. Pulling on first boot keeps `docker compose up -d`
    # a single step, and is a no-op once the volume already holds it.
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        until ollama list 2>/dev/null | grep -q all-minilm; do
          ollama pull all-minilm
        done
        wait

volumes:
  ollama-models:
